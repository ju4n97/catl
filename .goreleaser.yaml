# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: catl

before:
  hooks:
    - go mod verify

builds:
  - id: catl
    main: ./cmd/catl
    binary: catl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -tags=netgo,osusergo
    ldflags:
      - -s -w
      - -X {{ .ModulePath }}/internal/version.version={{ .Version }}
      - -X {{ .ModulePath }}/internal/version.shortCommit={{ .ShortCommit }}
      - -X {{ .ModulePath }}/internal/version.fullCommit={{ .FullCommit }}
      - -X {{ .ModulePath }}/internal/version.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: freebsd
        goarch: arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md*
      - LICENSE*
      - CONTRIBUTING.md*
      - SECURITY.md*
      - man/catl.1*

nfpms:
  - id: packages
    package_name: catl
    file_name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    homepage: "https://github.com/ju4n97/catl"
    maintainer: "Juan <https://github.com/ju4n97>"
    description: "Package manager, validator, and reader for declarative data."
    license: "MIT"
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    bindir: /usr/bin
    section: utils
    priority: optional
    contents:
      - src: ./man/catl.1
        dst: /usr/share/man/man1/catl.1
        file_info:
          mode: 0644

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

dockers_v2:
  - id: distroless
    ids: [catl]
    dockerfile: Dockerfile
    images:
      - ghcr.io/ju4n97/catl
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Package manager, validator, and reader for declarative data."
      org.opencontainers.image.source: "https://github.com/ju4n97/catl"
      org.opencontainers.image.url: "https://github.com/ju4n97/catl"
      org.opencontainers.image.documentation: "https://github.com/ju4n97/catl#readme"
      org.opencontainers.image.licenses: "MIT"
      org.opencontainers.image.authors: "Juan <https://github.com/ju4n97>"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
    annotations:
      org.opencontainers.image.base.name: "{{ .BaseImage }}"
      org.opencontainers.image.base.digest: "{{ .BaseImageDigest }}"

  - id: alpine
    ids: [catl]
    dockerfile: Dockerfile.alpine
    images:
      - ghcr.io/ju4n97/catl
    tags:
      - "{{ .Version }}-alpine"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}-alpine{{ end }}"
      - "{{ if not .Prerelease }}latest-alpine{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    sbom: true
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }} (Alpine with git)"
      org.opencontainers.image.description: "Package manager, validator, and reader for declarative data."
      org.opencontainers.image.source: "https://github.com/ju4n97/catl"
      org.opencontainers.image.url: "https://github.com/ju4n97/catl"
      org.opencontainers.image.documentation: "https://github.com/ju4n97/catl#readme"
      org.opencontainers.image.licenses: "MIT"
      org.opencontainers.image.authors: "Juan <https://github.com/ju4n97>"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
    annotations:
      org.opencontainers.image.base.name: "{{ .BaseImage }}"
      org.opencontainers.image.base.digest: "{{ .BaseImageDigest }}"

release:
  github:
    owner: ju4n97
    name: catl
  prerelease: auto
  draft: false
  mode: replace

changelog:
  sort: asc
  use: github
  abbrev: 7
  format: "{{ .SHA }}: {{ .Message }}{{ with .AuthorUsername }} (by @{{ . }}){{ end }}"
  filters:
    exclude:
      - '(?i)^merge\s+'
      - '(?i)^bump\s+'
      - '(?i)^dependabot'
      - '(?i)^wip'
      - '(?i)^docs(\(.*\))?:'
      - '(?i)^test(\(.*\))?:'
      - '(?i)^tests(\(.*\))?:'
      - '(?i)^ci(\(.*\))?:'
      - '(?i)^chore(\(.*\))?:'
      - '(?i)^style(\(.*\))?:'
  groups:
    - title: "Breaking changes"
      regexp: '(?i)^(\w+)(\(.*\))?!:|^breaking[- ]change:'
      order: 0
    - title: "Features and enhancements"
      regexp: '(?i)^feat(\(.*\))?!?:'
      order: 1
    - title: "Bug fixes and stability"
      regexp: '(?i)^fix(\(.*\))?!?:'
      order: 2
    - title: "Performance improvements"
      regexp: '(?i)^perf(\(.*\))?!?:'
      order: 3
    - title: "Refactoring and maintenance"
      regexp: '(?i)^refactor(\(.*\))?!?:'
      order: 4
    - title: "Other changes"
      order: 999